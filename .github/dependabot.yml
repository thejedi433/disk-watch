# Automated dependency vulnerability + version scanning.
# All first-party projects use uv (uv.lock + pyproject.toml); Dependabot's
# pip ecosystem understands uv.lock. Weekly grouping keeps PR volume low;
# security updates are raised as individual PRs with alert annotations.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
